name: E_Coffee CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '9.0.x'
  PROJECT_PATH: 'E_Coffee.csproj'

jobs:
  # ─── BUILD & TEST ─────────────────────────────────────────────────────────
  build:
    name: 🔨 Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🛠️ Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 📦 Restore dependencies
        run: dotnet restore ${{ env.PROJECT_PATH }}

      - name: 🔨 Build (Release)
        run: dotnet build ${{ env.PROJECT_PATH }} --configuration Release --no-restore

      - name: 📤 Publish (validate)
        run: dotnet publish ${{ env.PROJECT_PATH }} --configuration Release --no-build --output ./publish

  # ─── DEPLOY ────────────────────────────────────────────────────────────────
  # Railway tự động deploy khi push lên main thông qua GitHub Integration.
  # Không cần bước deploy thủ công ở đây.
  # Cách connect: railway.app → Project → Settings → Source → Connect GitHub repo
